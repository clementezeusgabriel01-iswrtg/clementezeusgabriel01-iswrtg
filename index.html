<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0d1117',
              panel: '#161b22',
              border: '#30363d',
              accent: '#2f81f7',
              bright: '#f0f6fc',
              muted: '#8b949e'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Inter', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

  <main class="max-w-4xl mx-auto space-y-8">

    <section id="stats" class="space-y-3">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="border border-brand-border rounded-lg bg-brand-panel p-4 flex items-center justify-center min-h-[190px]">
          <img 
            src="profile/streak.svg" 
            alt="GitHub Streak Stats" 
            class="max-w-full h-auto rounded"
            onerror="this.onerror=null; this.src='https://github-readme-streak-stats.herokuapp.com/?user=clementezeusgabriel01-iswrtg&theme=dark';"
          />
        </div>

        <div class="border border-brand-border rounded-lg bg-brand-panel p-4 flex items-center justify-center min-h-[190px]">
          <img 
            src="profile/top-langs.svg" 
            alt="Top Languages Stats" 
            class="max-w-full h-auto rounded"
            onerror="this.onerror=null; this.src='https://github-readme-stats.vercel.app/api/top-langs/?username=clementezeusgabriel01-iswrtg&layout=compact&theme=dark';"
          />
        </div>
      </div>
    </section>

    <section id="repos" class="space-y-3">
      <div id="repos-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="border border-brand-border bg-brand-panel p-4 rounded-lg space-y-3 animate-pulse">
          <div class="h-4 bg-brand-border/60 rounded w-1/2"></div>
          <div class="h-3 bg-brand-border/40 rounded w-3/4"></div>
        </div>
        <div class="border border-brand-border bg-brand-panel p-4 rounded-lg space-y-3 animate-pulse">
          <div class="h-4 bg-brand-border/60 rounded w-1/2"></div>
          <div class="h-3 bg-brand-border/40 rounded w-3/4"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const USERNAME = 'clementezeusgabriel01-iswrtg';

    const langColors = {
      'C': 'bg-blue-600/20 text-blue-400 border-blue-500/30',
      'C++': 'bg-pink-600/20 text-pink-400 border-pink-500/30',
      'Java': 'bg-amber-600/20 text-amber-400 border-amber-500/30',
      'Python': 'bg-yellow-600/20 text-yellow-400 border-yellow-500/30',
      'JavaScript': 'bg-yellow-500/20 text-yellow-300 border-yellow-400/30',
      'TypeScript': 'bg-sky-600/20 text-sky-400 border-sky-500/30',
      'HTML': 'bg-orange-600/20 text-orange-400 border-orange-500/30',
      'CSS': 'bg-indigo-600/20 text-indigo-400 border-indigo-500/30'
    };

    async function fetchGitHubRepos() {
      const container = document.getElementById('repos-list');

      try {
        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=10`);
        if (!res.ok) throw new Error('Failed to fetch repositories');
        const repos = await res.json();

        container.innerHTML = '';

        if (repos.length === 0) {
          container.innerHTML = `
            <div class="col-span-full p-4 text-center border border-brand-border rounded bg-brand-panel text-brand-muted font-mono text-xs">
              No public repositories found.
            </div>
          `;
          return;
        }

        repos.forEach(repo => {
          const langClass = langColors[repo.language] || 'bg-brand-border/40 text-brand-bright border-brand-border';
          
          const card = document.createElement('div');
          card.className = 'border border-brand-border bg-brand-panel hover:border-brand-accent/50 p-4 rounded-lg flex flex-col justify-between space-y-3 transition-all duration-150';
          card.innerHTML = `
            <div class="space-y-1.5">
              <div class="flex items-center justify-between">
                <a href="${repo.html_url}" target="_blank" rel="noopener" class="font-mono text-sm font-bold text-brand-bright hover:text-brand-accent transition-colors flex items-center space-x-1">
                  <span>${repo.name}</span>
                  <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
              </div>
              <p class="text-xs text-brand-muted line-clamp-2">
                ${repo.description || 'No description provided.'}
              </p>
            </div>

            <div class="flex items-center justify-between text-xs font-mono pt-2 border-t border-brand-border/40">
              <div>
                ${repo.language ? `<span class="px-2 py-0.5 rounded border text-[10px] ${langClass}">${repo.language}</span>` : '<span class="text-brand-muted text-[10px]">Text</span>'}
              </div>
              <div class="flex items-center space-x-3 text-brand-muted text-[11px]">
                <span class="flex items-center space-x-1">
                  <svg class="w-3 h-3 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                  <span>${repo.stargazers_count}</span>
                </span>
                <span class="flex items-center space-x-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                  <span>${repo.forks_count}</span>
                </span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `
          <div class="col-span-full p-4 text-center border border-red-500/20 bg-red-500/5 rounded text-red-400 font-mono text-xs">
            Unable to load public repositories.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', fetchGitHubRepos);
  </script>
</body>
</html>
