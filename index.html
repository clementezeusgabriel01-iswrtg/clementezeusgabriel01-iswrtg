<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clementezeusgabriel01-iswrtg · GitHub Stats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading-screen" aria-hidden="false">
    <div class="loading-inner">
      <span class="loading-prompt">$ fetching stats<span class="cursor">_</span></span>
    </div>
  </div>

  <div class="page">

    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">clementezeusgabriel01-iswrtg</span>
        </div>
        <a class="header-link" href="https://github.com/clementezeusgabriel01-iswrtg" target="_blank" rel="noopener">
          View on GitHub
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>
    </header>

    <main class="content">

      <section class="page-intro">
        <h1>Repository statistics</h1>
        <p>Contribution streak, top languages, and the most recently updated public repositories.</p>
      </section>

      <section id="stats" class="stats-grid">
        <div class="stat-card">
          <h2 class="stat-card-title">Contribution streak</h2>
          <div class="stat-card-body">
            <img
              src="profile/streak.svg"
              alt="GitHub Streak Stats"
              onerror="this.onerror=null; this.src='https://github-readme-streak-stats.herokuapp.com/?user=clementezeusgabriel01-iswrtg&theme=dark';"
            />
          </div>
        </div>

        <div class="stat-card">
          <h2 class="stat-card-title">Top languages</h2>
          <div class="stat-card-body">
            <img
              src="profile/top-langs.svg"
              alt="Top Languages Stats"
              onerror="this.onerror=null; this.src='https://github-readme-stats.vercel.app/api/top-langs/?username=clementezeusgabriel01-iswrtg&layout=compact&theme=dark';"
            />
          </div>
        </div>
      </section>

      <section id="repos" class="repos-section">
        <h2 class="section-title">Recent repositories</h2>
        <div id="repos-list" class="repos-grid">
          <div class="repo-card skeleton">
            <div class="skeleton-line w-half"></div>
            <div class="skeleton-line w-three-quarter"></div>
          </div>
          <div class="repo-card skeleton">
            <div class="skeleton-line w-half"></div>
            <div class="skeleton-line w-three-quarter"></div>
          </div>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>Built by Zeus @2026.</span>
        <span id="footer-updated" class="footer-updated"></span>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
