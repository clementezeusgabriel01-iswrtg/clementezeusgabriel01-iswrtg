name: Generate Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=clementezeusgabriel01-iswrtg&theme=dark&background=0d1117
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      - name: Commit and Push Generated Files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update profile stats SVGs"
          file_pattern: profile/*.svg
          pull_strategy: 'NO-FAST-FORWARD'
