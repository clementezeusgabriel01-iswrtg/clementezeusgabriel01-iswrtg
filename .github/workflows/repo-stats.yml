name: Generate Profile Stats Images

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=clementezeusgabriel01-iswrtg&theme=tokyonight&background=0d1117
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
