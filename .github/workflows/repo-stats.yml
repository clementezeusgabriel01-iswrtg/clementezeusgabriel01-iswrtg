name: Generate Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=clementezeusgabriel01-iswrtg&theme=tokyonight&background=0d1117
          path: profile/streak.svg
          token: ${{ secrets.STRE_TOKEN }} # (or keep your STREAK_STATS_TOKEN)

      - name: Generate Top Languages
        uses: anuraghazra/github-readme-stats@master
        with:
          filename: top-langs.svg
          options: username=clementezeusgabriel01-iswrtg&layout=compact&theme=dark&langs_count=6
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          path: profile/top-langs.svg

      - name: Commit Generated Files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update profile stats SVGs"
          file_pattern: profile/*.svg
